<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC AutoAssist - Direct Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            background: #DB0011;
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        h1 {
            color: #DB0011;
            text-align: center;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #DB0011;
        }
        
        button {
            width: 100%;
            background: #DB0011;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background: #B8000E;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .credentials {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        
        .loading {
            display: none;
            text-align: center;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #DB0011;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">HSBC</div>
        <h1>AutoAssist</h1>
        <div class="subtitle">DC Automation Support Team</div>
        
        <div class="credentials">
            <strong>Test Credentials:</strong><br>
            <strong>Admin:</strong> admin / admin123 (Full access + Dashboard)<br>
            <strong>User:</strong> john_doe / user123 (Chat + Incident creation)
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="admin" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="admin123" required>
            </div>
            
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            Signing in...
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        const API_BASE = 'http://77.37.45.138:8000';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const form = document.getElementById('loginForm');
            
            // Show loading
            form.style.display = 'none';
            loading.style.display = 'block';
            resultDiv.innerHTML = '';
            
            console.log('🚀 Starting login process...');
            console.log('Username:', username);
            console.log('API URL:', `${API_BASE}/api/auth/login`);
            
            try {
                // Make the login request
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (response.ok && data.access_token) {
                    // Success!
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user_info));
                    
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✅ Login Successful!</strong><br>
                            Welcome, ${data.user_info.full_name}!<br>
                            Role: ${data.user_info.role}<br><br>
                            <strong>Redirecting to chat...</strong>
                        </div>
                    `;
                    
                    // Redirect to the React app chat page
                    setTimeout(() => {
                        window.location.href = '/chat';
                    }, 2000);
                    
                } else {
                    // Login failed
                    resultDiv.innerHTML = `
                        <div class="error">
                            <strong>❌ Login Failed</strong><br>
                            ${data.detail || 'Invalid credentials'}
                        </div>
                    `;
                    form.style.display = 'block';
                    loading.style.display = 'none';
                }
                
            } catch (error) {
                console.error('Login error:', error);
                
                resultDiv.innerHTML = `
                    <div class="error">
                        <strong>❌ Connection Error</strong><br>
                        ${error.message}<br><br>
                        <strong>Troubleshooting:</strong><br>
                        • Check if backend is running: <a href="${API_BASE}" target="_blank">${API_BASE}</a><br>
                        • Check browser console for detailed error<br>
                        • Check if CORS is properly configured
                    </div>
                `;
                
                form.style.display = 'block';
                loading.style.display = 'none';
            }
        });
        
        // Test backend connectivity on page load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/`, { 
                    method: 'GET',
                    mode: 'cors'
                });
                
                if (response.ok) {
                    console.log('✅ Backend connectivity test passed');
                } else {
                    console.warn('⚠️ Backend responded with status:', response.status);
                }
            } catch (error) {
                console.error('❌ Backend connectivity test failed:', error);
                document.getElementById('result').innerHTML = `
                    <div class="error">
                        <strong>⚠️ Backend Connection Issue</strong><br>
                        Cannot reach ${API_BASE}<br>
                        Error: ${error.message}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
